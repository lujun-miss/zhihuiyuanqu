<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 合同管理 · 智慧园区</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span class="space-x-1.5"><i class="fa-solid fa-signal text-xs"></i><i class="fa-solid fa-wifi text-xs"></i><i class="fa-solid fa-battery-three-quarters text-sm"></i></span></div>
  <div class="navbar bg-white"><a href="home.html" class="pl-2"><i class="fa-solid fa-angle-left text-lg"></i></a><span>合同管理</span><i class="fa-solid fa-plus text-slate-400"></i></div>
  <div class="scroll hsb px-4 pb-4">
    <!-- 到期提醒 -->
    <div class="rounded-2xl bg-gradient-to-r from-amber-400 to-orange-400 text-white p-4 mt-3 flex items-center gap-3">
      <i class="fa-solid fa-triangle-exclamation text-xl"></i>
      <div class="flex-1"><div class="text-sm font-bold">合同到期提醒</div><div class="text-[11px] text-white/85 mt-0.5">主厂房合同将于 2026-09-30 到期，可发起续租</div></div>
      <div class="chip bg-white/20 text-white !py-1.5">去续租</div>
    </div>
    <!-- 筛选 -->
    <div class="flex gap-2 mt-4 overflow-x-auto hsb pb-1">
      <span class="chip bg-indigo-600 text-white !text-xs !py-2 !px-3.5">全部 2</span>
      <span class="chip bg-slate-100 text-slate-500 !text-xs !py-2 !px-3.5">履行中</span>
      <span class="chip bg-slate-100 text-slate-500 !text-xs !py-2 !px-3.5">即将到期 1</span>
      <span class="chip bg-slate-100 text-slate-500 !text-xs !py-2 !px-3.5">已退租</span>
    </div>
    <!-- 合同卡片 -->
    <div class="card p-4 mt-3">
      <div class="flex items-center justify-between">
        <div class="text-xs text-slate-400">合同编号 HT-2023090112</div>
        <span class="chip bg-amber-50 text-amber-600">即将到期</span>
      </div>
      <div class="text-[15px] font-bold mt-2">A3栋 · 2F-201 智能厂房租赁合同</div>
      <div class="grid grid-cols-2 gap-y-2 mt-3 text-xs">
        <div class="text-slate-400">租期</div><div class="text-right text-slate-600">2023-09-01 ~ 2026-09-30</div>
        <div class="text-slate-400">月租金</div><div class="text-right font-semibold">¥9,100.00</div>
        <div class="text-slate-400">押金（已缴）</div><div class="text-right text-slate-600">¥27,300.00</div>
      </div>
      <div class="flex gap-2.5 mt-3.5 pt-3.5 border-t border-slate-100">
        <div class="btn h-9 flex-1 border border-slate-200 text-slate-600 text-xs rounded-full">查看详情</div>
        <div class="btn h-9 flex-1 bg-indigo-600 text-white text-xs rounded-full">申请续租</div>
      </div>
    </div>
    <div class="card p-4 mt-3">
      <div class="flex items-center justify-between">
        <div class="text-xs text-slate-400">合同编号 HT-2022010805</div>
        <span class="chip bg-slate-100 text-slate-400">已退租</span>
      </div>
      <div class="text-[15px] font-bold mt-2">B1栋 · 1F-102 仓库租赁合同</div>
      <div class="grid grid-cols-2 gap-y-2 mt-3 text-xs">
        <div class="text-slate-400">租期</div><div class="text-right text-slate-600">2022-01-08 ~ 2023-01-07</div>
        <div class="text-slate-400">月租金</div><div class="text-right text-slate-600">¥3,200.00</div>
      </div>
    </div>
    <p class="text-[11px] text-slate-400 mt-3 px-1 flex items-center gap-1.5"><i class="fa-solid fa-circle-info"></i>到期前 90 天内可发起续租，租金按 3%/年 递增</p>
  </div>
</div>
</body>
</html>
