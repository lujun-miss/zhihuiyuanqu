<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新增房源 · 智慧园区管理端</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/common.css">
</head>
<body class="web">
  <aside class="sidebar">
    <div class="s-logo">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 flex items-center justify-center text-white text-sm"><i class="fa-solid fa-industry"></i></div>
      <div><div class="text-white font-bold text-[15px]">智汇·科创园</div><div class="text-[10px] text-slate-500 mt-0.5">园区运营管理端</div></div>
    </div>
    <nav class="mt-1">
      <div class="s-cat">总览</div>
      <a class="s-link" href="admin-dashboard.html"><i class="fa-solid fa-gauge-high"></i>运营驾驶舱</a>
      <div class="s-cat">资产管理</div>
      <a class="s-link active" href="admin-space.html"><i class="fa-regular fa-building"></i>房源资产</a>
      <a class="s-link" href="admin-contracts.html"><i class="fa-solid fa-file-signature"></i>合同中心</a>
      <div class="s-cat">经营管理</div>
      <a class="s-link" href="admin-billing.html"><i class="fa-solid fa-coins"></i>收租管理</a>
      <a class="s-link" href="admin-meter-manage.html"><i class="fa-solid fa-bolt"></i>水电表管理</a>
      <a class="s-link" href="admin-meter.html"><i class="fa-regular fa-clipboard"></i>抄表录入</a>
      <a class="s-link" href="admin-invoice.html"><i class="fa-solid fa-file-invoice"></i>发票管理</a>
      <div class="s-cat">服务管理</div>
      <a class="s-link" href="admin-workorder.html"><i class="fa-solid fa-clipboard-list"></i>工单管理</a>
      <a class="s-link" href="admin-tenants.html"><i class="fa-solid fa-users"></i>企业档案</a>
      <a class="s-link" href="admin-notice.html"><i class="fa-solid fa-bullhorn"></i>公告管理</a>
    </nav>
    <div class="s-foot"><i class="fa-regular fa-circle-question mr-1"></i>帮助中心 · v2.4.0</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <a href="admin-space.html" class="btn h-9 px-3.5 border border-slate-200 text-slate-600 text-xs rounded-lg"><i class="fa-solid fa-angle-left mr-1"></i>返回</a>
      <div class="ml-4"><div class="font-bold text-[16px] text-slate-800">新增房源</div><div class="text-[11px] text-slate-400 mt-0.5">录入空置房源信息 · 自动同步至招商房源列表</div></div>
      <div class="ml-auto flex items-center gap-2.5">
        <div class="btn h-9 px-4 border border-slate-200 text-slate-600 text-xs rounded-lg">保存草稿</div>
        <div class="btn h-9 px-4 bg-indigo-600 text-white text-xs rounded-lg">保存并发布</div>
      </div>
    </header>
    <div class="content max-w-3xl">
      <form class="wcard p-6 space-y-5">
        <div>
          <div class="font-bold text-slate-800 mb-4 text-sm"><i class="fa-solid fa-location-dot text-indigo-500 mr-1.5"></i>位置信息</div>
          <div class="grid grid-cols-3 gap-4">
            <div><label class="lbl">楼栋</label><select class="inp"><option>A1栋</option><option>A3栋</option><option>B1栋</option><option>B2栋</option></select></div>
            <div><label class="lbl">楼层</label><select class="inp"><option>2F</option><option>3F</option><option>4F</option><option>5F</option></select></div>
            <div><label class="lbl">房间号</label><input class="inp" placeholder="如 201" value="201"></div>
          </div>
        </div>
        <hr class="border-slate-100">
        <div>
          <div class="font-bold text-slate-800 mb-4 text-sm"><i class="fa-solid fa-ruler-combined text-indigo-500 mr-1.5"></i>面积与配置</div>
          <div class="grid grid-cols-3 gap-4">
            <div><label class="lbl">建筑面积(㎡)</label><input class="inp" value="580"></div>
            <div><label class="lbl">可租面积(㎡)</label><input class="inp" value="560"></div>
            <div><label class="lbl">层高(m)</label><input class="inp" value="4.5"></div>
            <div><label class="lbl">承重(kg/㎡)</label><input class="inp" value="800"></div>
            <div><label class="lbl">用电容量(kW)</label><input class="inp" value="120"></div>
            <div><label class="lbl">货梯(部)</label><input class="inp" value="2"></div>
          </div>
        </div>
        <hr class="border-slate-100">
        <div>
          <div class="font-bold text-slate-800 mb-4 text-sm"><i class="fa-solid fa-tag text-indigo-500 mr-1.5"></i>招商信息</div>
          <div class="grid grid-cols-3 gap-4">
            <div><label class="lbl">月租金单价(元/㎡/月)</label><input class="inp" value="35"></div>
            <div><label class="lbl">月租金总价(元)</label><input class="inp" value="19,600" readonly></div>
            <div><label class="lbl">物业费单价(元/㎡/月)</label><input class="inp" value="5"></div>
            <div><label class="lbl">最小可租面积(㎡)</label><input class="inp" value="200"></div>
            <div><label class="lbl">租期要求</label><select class="inp"><option>1年起租</option><option>2年起租</option><option>3年起租</option></select></div>
            <div><label class="lbl">装修状态</label><select class="inp"><option>毛坯</option><option>简装</option><option>精装</option></select></div>
          </div>
          <div class="mt-4"><label class="lbl">房源标签（多选）</label><div class="flex flex-wrap gap-2 mt-1.5"><span class="chip bg-indigo-50 text-indigo-600 cursor-pointer">可分割</span><span class="chip bg-indigo-50 text-indigo-600 cursor-pointer">独立货梯</span><span class="chip bg-white border border-slate-200 text-slate-400 cursor-pointer">天然气</span><span class="chip bg-indigo-50 text-indigo-600 cursor-pointer">环评合规</span><span class="chip bg-white border border-slate-200 text-slate-400 cursor-pointer">独立空调</span><span class="chip bg-white border border-slate-200 text-slate-400 cursor-pointer">免租期</span></div></div>
        </div>
        <hr class="border-slate-100">
        <div>
          <div class="font-bold text-slate-800 mb-4 text-sm"><i class="fa-regular fa-image text-indigo-500 mr-1.5"></i>房源图片</div>
          <div class="grid grid-cols-4 gap-3">
            <div class="aspect-[4/3] rounded-xl bg-slate-100 border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 cursor-pointer"><i class="fa-solid fa-plus text-xl mb-1"></i><span class="text-xs">上传图片</span></div>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
