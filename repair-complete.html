<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>提交完工 · 维修端</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span class="space-x-1.5"><i class="fa-solid fa-signal text-xs"></i><i class="fa-solid fa-wifi text-xs"></i><i class="fa-solid fa-battery-three-quarters text-sm"></i></span></div>
  <div class="navbar bg-white">
    <a href="repair-home.html" class="pl-2"><i class="fa-solid fa-angle-left"></i></a>
    <span>提交完工</span>
    <span class="text-xs font-normal text-slate-400">GD-20260830-01</span>
  </div>
  <div class="scroll hsb px-4 pb-4">
    <!-- 工单概要 -->
    <div class="card p-3.5 mt-3.5">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-sky-50 text-sky-500 flex items-center justify-center"><i class="fa-solid fa-snowflake"></i></div>
        <div class="flex-1"><div class="font-bold text-slate-800 text-sm">中央空调不制冷</div><div class="text-[11px] text-slate-400 mt-0.5">A3栋 2F-201 · 晨阳精密制造</div></div>
        <span class="chip bg-sky-50 text-sky-600 !text-xs">处理中</span>
      </div>
    </div>
    <!-- 完工表单 -->
    <div class="card p-3.5 mt-3">
      <div class="text-xs font-bold text-slate-800 mb-3">维修完工信息</div>
      <div class="space-y-3">
        <div>
          <label class="lbl">到场时间</label>
          <input class="inp" type="datetime-local" value="2026-09-01T10:12">
        </div>
        <div>
          <label class="lbl">完工时间 <span class="text-rose-400">*</span></label>
          <input class="inp" type="datetime-local">
        </div>
        <div>
          <label class="lbl">维修说明 <span class="text-rose-400">*</span></label>
          <textarea class="inp" rows="4" placeholder="请填写维修过程、更换配件、故障原因等…"></textarea>
        </div>
        <div>
          <label class="lbl">完工照片 <span class="text-rose-400">*</span></label>
          <div class="flex gap-2.5">
            <div class="w-20 h-20 rounded-lg border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-300"><i class="fa-solid fa-camera text-lg"></i><span class="text-[9px] mt-0.5">拍照</span></div>
            <div class="w-20 h-20 rounded-lg border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-300"><i class="fa-solid fa-camera text-lg"></i><span class="text-[9px] mt-0.5">拍照</span></div>
            <div class="w-20 h-20 rounded-lg border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-300"><i class="fa-solid fa-camera text-lg"></i><span class="text-[9px] mt-0.5">拍照</span></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 费用填报 -->
    <div class="card p-3.5 mt-3">
      <div class="text-xs font-bold text-slate-800 mb-3">费用填报</div>
      <div class="space-y-3">
        <div>
          <label class="lbl">人工费（元）</label>
          <input class="inp" type="number" placeholder="如 480">
        </div>
        <div>
          <label class="lbl">配件费（元）</label>
          <input class="inp" type="number" placeholder="如 2200">
        </div>
        <div>
          <label class="lbl">材料费（元）</label>
          <input class="inp" type="number" placeholder="如 0">
        </div>
        <div class="flex justify-between border-t border-slate-100 pt-2 text-xs"><span class="font-bold text-slate-700">合计</span><span class="font-bold text-indigo-600">¥ 待填写</span></div>
        <div class="p-2.5 rounded-lg bg-indigo-50/50 text-[11px] text-slate-500"><i class="fa-solid fa-circle-info text-indigo-400 mr-1"></i>费用需运营方验收后计入企业账单</div>
      </div>
    </div>
    <!-- 提交按钮 -->
    <a href="repair-home.html" class="btn h-12 w-full mt-4 bg-emerald-600 text-white text-sm rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-check"></i>提交完工</a>
    <a href="repair-home.html" class="btn h-10 w-full mt-2 border border-slate-200 text-slate-600 text-xs rounded-lg">保存草稿</a>
  </div>
</div>
</body>
</html>
