<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 账单缴费 · 智慧园区</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="screen">
  <div class="bg-gradient-to-br from-indigo-600 to-violet-500 text-white pb-14 flex-shrink-0">
    <div class="statusbar text-white"><span>9:41</span><span class="space-x-1.5"><i class="fa-solid fa-signal text-xs"></i><i class="fa-solid fa-wifi text-xs"></i><i class="fa-solid fa-battery-three-quarters text-sm"></i></span></div>
    <div class="navbar"><a href="home.html" class="pl-2"><i class="fa-solid fa-angle-left text-lg"></i></a><span>账单缴费</span><i class="fa-solid fa-ellipsis"></i></div>
    <div class="px-5 pt-1 flex items-end justify-between">
      <div><div class="text-xs text-indigo-200">待缴总额（4 笔）</div><div class="text-3xl font-bold mt-1">¥12,860.00</div></div>
      <div class="text-right text-[11px] text-indigo-200 leading-relaxed pb-1">本年已缴 ¥86,420<br>共 38 笔</div>
    </div>
  </div>
  <div class="scroll hsb -mt-8 px-4 pb-4">
    <div class="card flex text-center text-sm font-semibold overflow-hidden">
      <div class="flex-1 py-3 text-indigo-600 relative">待缴 4<span class="absolute bottom-0 left-1/3 right-1/3 h-0.5 bg-indigo-600 rounded-full"></span></div>
      <div class="flex-1 py-3 text-slate-400">已缴</div>
    </div>
    <div class="card mt-3 divide-y divide-slate-50">
      <div class="p-3.5 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-indigo-600"></i>
        <div class="itile bg-indigo-50 text-indigo-500 itile-sm"><i class="fa-solid fa-key"></i></div>
        <div class="flex-1 min-w-0"><div class="text-sm font-semibold">厂房租金 · 2026年9月</div><div class="text-[11px] text-slate-400 mt-0.5">A3栋 2F-201 · 09-05 到期</div></div>
        <div class="font-bold text-sm">¥9,100.00</div>
      </div>
      <div class="p-3.5 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-indigo-600"></i>
        <div class="itile bg-slate-100 text-slate-500 itile-sm"><i class="fa-solid fa-building"></i></div>
        <div class="flex-1 min-w-0"><div class="text-sm font-semibold">物业管理费 · 2026年9月</div><div class="text-[11px] text-slate-400 mt-0.5">260㎡ × ¥6/㎡ · 09-05 到期</div></div>
        <div class="font-bold text-sm">¥1,560.00</div>
      </div>
      <div class="p-3.5 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-indigo-600"></i>
        <div class="itile bg-amber-50 text-amber-500 itile-sm"><i class="fa-solid fa-bolt"></i></div>
        <div class="flex-1 min-w-0"><div class="text-sm font-semibold">电费 · 2026年8月</div><div class="text-[11px] text-slate-400 mt-0.5">用量 2,460 度 · 抄表日 08-31</div></div>
        <div class="font-bold text-sm">¥1,850.00</div>
      </div>
      <div class="p-3.5 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-indigo-600"></i>
        <div class="itile bg-sky-50 text-sky-500 itile-sm"><i class="fa-solid fa-droplet"></i></div>
        <div class="flex-1 min-w-0"><div class="text-sm font-semibold">水费 · 2026年8月</div><div class="text-[11px] text-slate-400 mt-0.5">用量 118 吨 · 抄表日 08-31</div></div>
        <div class="font-bold text-sm">¥350.00</div>
      </div>
    </div>
    <p class="text-[11px] text-slate-400 mt-3 px-1 flex items-center gap-1.5"><i class="fa-solid fa-circle-info"></i>水电费由园区自动抄表生成账单，支付后可在线申请开票</p>
  </div>
  <div class="flex-shrink-0 bg-white border-t border-slate-100 px-4 py-3 flex items-center gap-3">
    <div class="flex-1"><div class="text-[11px] text-slate-400">已选 4 笔 · 全选</div><div class="font-bold text-lg">¥12,860.00</div></div>
    <a href="payment.html" class="btn px-8 bg-indigo-600 text-white rounded-full">去支付</a>
  </div>
</div>
</body>
</html>
